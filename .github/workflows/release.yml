name: Build packages

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    # Built on Debian 12 so the package installs on Debian 12+ and Ubuntu 24.04+.
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake pkg-config libsqlite3-dev libbpf-dev clang bpftool \
            qt6-base-dev libqt6charts6-dev dpkg-dev file
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
      - name: Package
        run: cd build && cpack -G DEB
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf install -y gcc-c++ cmake pkgconf-pkg-config sqlite-devel libbpf-devel clang bpftool \
            qt6-qtbase-devel qt6-qtcharts-devel rpm-build
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
      - name: Package
        run: cd build && cpack -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: build/*.rpm

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake clang bpf pkgconf sqlite libbpf qt6-base qt6-charts
      - name: Build with PKGBUILD
        run: |
          useradd -m builder
          mkdir -p /tmp/pkg/src/bandsight-0.1.0
          cp -r . /tmp/pkg/src/bandsight-0.1.0/
          cp packaging/arch/PKGBUILD packaging/arch/bandsight.install /tmp/pkg/
          cd /tmp/pkg
          # Build from the checked-out tree instead of the release tarball.
          sed -i 's/^source=.*/source=()/; s/^sha256sums=.*/sha256sums=()/' PKGBUILD
          chown -R builder /tmp/pkg
          su builder -c 'makepkg --noconfirm'
          cp /tmp/pkg/*.pkg.tar.zst "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: '*.pkg.tar.zst'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
